# ===================================================================
# 2️⃣ 节点信息 (可在此处手动添加单个节点)
# ===================================================================
proxies:
  - {name: 直连, type: direct, default: true}
  # - {name: "拒绝连接", type: reject, default: true}


# ===================================================================
# 3️⃣ 全局设置 (混合端口、日志等级等)
# ===================================================================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
# interface-name: eth0 # 指定网卡，多网卡环境（如旁路由）请填写正确的出口网卡名
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# ===================================================================
# 4️⃣ DNS 配置 (核心模块，影响解析速度和准确性)
# ===================================================================
dns:
  enable: true
  listen: 0.0.0.0:7874 # OpenClash 的 DNS 监听端口，默认即可
  ipv6: false
  enhanced-mode: fake-ip # 推荐使用 fake-ip 模式以优化网络性能
  fake-ip-range: 28.0.0.1/8 # Fake-IP 地址段
  # fake-ip-filter: # 保护哪些域名不被 Fake-IP，防止局域网服务异常
  #   - '*.lan'
  #   - '*.local'
  
  # 因为 allows-lan: true，请填写真实的国内DNS地址，避免DNS污染
  default-nameserver: 
    - 223.5.5.5
    - 119.29.29.29
  
  # 解析代理服务器域名时使用的 Nameserver，建议使用国内DNS
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  # Nameserver 策略组的DNS，用于解析国外域名
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - tls://8.8.4.4:853 # 备用TLS DNS
  
  # Fallback 策略组的DNS，当上面Nameserver解析失败时使用
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - tls://1.0.0.1:853 # 备用TLS DNS
  
  # 直连策略组使用的DNS
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  fallback-filter:
    geoip: true # 匹配GeoIP数据为非CN的域名时，使用Fallback DNS
    geoip-code: CN
    ipcidr: # 匹配到以下IP段时，使用Fallback DNS
      - 240.0.0.0/4

# ===================================================================
# 5️⃣ 网络嗅探与 TUN 模式
# ===================================================================
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  # 强制嗅探的域名
  force-domain:
    - "+.v2ex.com"
    - "+.google.com"
  # 跳过嗅探的域名
  skip-domain:
    - "+.baidu.com"

# TUN 模式配置 (推荐开启，透明代理)
tun:
  enable: true
  stack: mixed # 可选 system / gvisor / mixed
  dns-hijack:
    -任何:53
  auto-route: true # 自动配置路由表
  auto-redirect: true # 自动配置透明代理的重定向规则
  auto-detect-interface: true # 自动检测出口网卡

# ===================================================================
# 6️⃣ 策略组配置 (核心流控逻辑)
# ===================================================================
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, 直连]}
  - {name: 📹 YouTube, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, 直连]}
  - {name: 🍀 Google, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, 直连]}
  - {name: 🤖 ChatGPT, type: select, proxies: [♻️ 美国自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 自动选择, ♻️ 手动选择, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🌐 全部节点, 直连]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🚀 默认代理]}
  - {name: 🪟 Microsoft, type: select, proxies: [直连, 🚀 默认代理]}
  - {name: 🐬 OneDrive , type: select , proxies: [直连, 🚀 默认代理]}
  - {name: 📲 Telegram, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🌐 全部节点, 直连]}
  - {name: 🔰 广告拦截 , type: select , proxies: ["REJECT", "DIRECT"]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 直连, ♻️ 自动选择, 🌐 全部节点]}

  # --- 区域节点选择器 ---
  - {name: 🇭🇰 香港节点, type: select, include-all-providers: true, filter: "(?i)港|hk|hongkong"}
  - {name: 🇯🇵 日本节点, type: select, include-all-providers: true, filter: "(?i)日|jp|japan"}
  - {name: 🇸🇬 狮城节点, type: select, include-all-providers: true, filter: "(?i)新加坡|坡|狮城|sg|singapore"}
  - {name: 🇺🇲 美国节点, type: select, include-all-providers: true, filter: "(?i)美|us|america|unitedstates"}

  # --- 自动选择和全部节点 ---
  - {name: ♻️ 香港自动，type: url-test, include-all-providers: true, tolerance: 50, interval: 300, filter: "(?i)港|hk|hongkong"}
  - {name: ♻️ 日本自动，type: url-test, include-all-providers: true, tolerance: 50, interval: 300, filter: "(?i)日|jp|japan"}
  - {name: ♻️ 狮城自动，type: url-test, include-all-providers: true, tolerance: 50, interval: 300, filter: "(?i)新加坡|坡|狮城|sg|singapore"}
  - {name: ♻️ 美国自动，type: url-test, include-all-providers: true, tolerance: 50, interval: 300, filter: "(?i)美|us|america|unitedstates"}
  - {name: ♻️ 自动选择, type: url-test, include-all-providers: true, tolerance: 50, interval: 300}
  - {name: ♻️ 手动选择, type: select, include-all-providers: true}
  - {name: 🌐 全部节点, type: select, include-all-providers: true}

# ===================================================================
# 7️⃣ 分流规则配置
# ===================================================================
rules:
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - DOMAIN,self.privy.app,🤖 ChatGPT
  - DOMAIN,chatgpt.com,🤖 ChatGPT
  - DOMAIN-SUFFIX，openai.com,🤖 ChatGPT
  - DOMAIN-KEYWORD,chatgpt,🤖 ChatGPT
  - DOMAIN-KEYWORD,openai,🤖 ChatGPT
  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET，google_domain,🍀 Google
  - RULE-SET，github_domain,👨🏿‍💻 GitHub
  - RULE-SET，telegram_domain,📲 Telegram
  - RULE-SET，microsoft_domain,🪟 Microsoft
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,apple_domain,DIRECT
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT
  - RULE-SET,ad,🔰 广告拦截
  - GEOIP,CN,DIRECT
  - MATCH，🐟 漏网之鱼

# ===================================================================
# 8️⃣ 规则集 (定期从网络更新规则，减少本地配置体积)
# ===================================================================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

rule-providers:
  # 私有地址
  private_ip: { <<: *ip, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"}
  private_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"}

  # AI相关
  ai: {<<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite/OpenAI.list"}
  
  # 流媒体
  youtube_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia/YouTube.list"}
  google_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist/Google.list"}
  telegram_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist/Telegram.list"}

  # 常用
  github_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite/GitHub.list"}
  microsoft_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite/Microsoft.list"}
  onedrive_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list"}
  apple_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list"}
  
  # 国内
  cn_domain: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list"}
  cn_ip: { <<: *ip, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIPs.list"}
  
  # 广告
  ad: { <<: *domain, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"}
