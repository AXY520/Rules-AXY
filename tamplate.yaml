ProxyGoogle: &ProxyGoogle [🚀 默认代理, 🛟 故障转移, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 狮城自动, 🇺🇸 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT]
ProxyAI: &ProxyAI [🚀 默认代理, 🛟 故障转移, 🇯🇵 日本自动, 🇸🇬 狮城自动, 🇺🇸 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT]
ProxyNodeSelect: &ProxyNodeSelect [🛟 故障转移, 🇭🇰 香港自动, 🇯🇵 日本自动, 🇸🇬 狮城自动, 🇺🇸 美国自动, ♻️ 自动选择, ♻️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇲 美国节点, 🌐 全部节点, DIRECT]

