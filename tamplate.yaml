### 规则配置
RuleSet_classical: &RuleSet_classical {type: http, behavior: classical, interval: 43200, format: text, proxy: 🚀 默认代理}
RuleSet_domain: &RuleSet_domain {type: http, behavior: domain, interval: 43200, format: text, proxy: 🚀 默认代理}
RuleSet_ipcidr: &RuleSet_ipcidr {type: http, behavior: ipcidr, interval: 43200, format: text, proxy: 🚀 默认代理}

# 主流稳定规则源：DustinWin ruleset_geodata（Release 直链，不依赖各种 CDN 镜像）
RuleSet_mrs_domain: &RuleSet_mrs_domain {type: http, behavior: domain, interval: 43200, format: mrs, proxy: 🚀 默认代理}
RuleSet_mrs_ipcidr: &RuleSet_mrs_ipcidr {type: http, behavior: ipcidr, interval: 43200, format: mrs, proxy: 🚀 默认代理}

# 订阅规则（主流稳定：DustinWin ruleset_geodata Release）
rule-providers:
  # DNS fake-ip 排除列表
  fakeip-filter:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs
    path: ./rule_set/dustinwin/fakeip-filter.mrs

  # Tencent（微信/QQ 等）直连：继续沿用 blackmatrix7
  tencent:
    type: http
    behavior: classical
    interval: 86400
    format: yaml
    proxy: 🚀 默认代理
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent.yaml
    path: ./rule_set/blackmatrix7/tencent.yaml

  # 中国域名 / 中国IP
  cn:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs
    path: ./rule_set/dustinwin/cn.mrs

  cnip:
    <<: *RuleSet_mrs_ipcidr
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cnip.mrs
    path: ./rule_set/dustinwin/cnip.mrs

  # 私有网络（域名+IP）
  private:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.mrs
    path: ./rule_set/dustinwin/private.mrs

  privateip:
    <<: *RuleSet_mrs_ipcidr
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.mrs
    path: ./rule_set/dustinwin/privateip.mrs

  # 广告/追踪
  ads:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ads.mrs
    path: ./rule_set/dustinwin/ads.mrs

  trackerslist:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/trackerslist.mrs
    path: ./rule_set/dustinwin/trackerslist.mrs

  # 代理分流（国内外）
  proxy:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.mrs
    path: ./rule_set/dustinwin/proxy.mrs

  gfw:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/gfw.mrs
    path: ./rule_set/dustinwin/gfw.mrs

  # 业务分流
  google:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/google-cn.mrs
    path: ./rule_set/dustinwin/google-cn.mrs

  youtube:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/youtube.mrs
    path: ./rule_set/dustinwin/youtube.mrs

  microsoft:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.mrs
    path: ./rule_set/dustinwin/microsoft-cn.mrs

  telegramip:
    <<: *RuleSet_mrs_ipcidr
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/telegramip.mrs
    path: ./rule_set/dustinwin/telegramip.mrs

  ai:
    <<: *RuleSet_mrs_domain
    url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ai.mrs
    path: ./rule_set/dustinwin/ai.mrs

# 分流规则
rules:
  # 0) fake-ip filter 规则集（必须在 rules 里显式引用，避免 fake-ip-filter 中的 `rule-set:` 无效）
  - RULE-SET,fakeip-filter,DIRECT

  # 1) 先把所有 RFC1918/本机/链路本地 之类内网 IP 直连（不依赖 rule-provider，直接写死最稳）
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve

  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 2) 私有网络（域名+IP）直连
  - RULE-SET,private,DIRECT
  - RULE-SET,privateip,DIRECT,no-resolve

  # 其他直连（保留）
  - RULE-SET,tencent,DIRECT
  - DOMAIN-SUFFIX,heiyu.space,DIRECT
  - DOMAIN-SUFFIX,lazycat.cloud,DIRECT

  # 3) 广告/追踪
  - RULE-SET,ads,REJECT
  - RULE-SET,trackerslist,REJECT

  # 4) 业务分流（按需）
  - RULE-SET,ai,🤖 AI
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,google,🍀 Google
  - RULE-SET,microsoft,🪟 Microsoft
  - RULE-SET,telegramip,📲 Telegram,no-resolve

  # 5) 中国直连（域名+IP）
  - RULE-SET,cn,DIRECT
  - RULE-SET,cnip,DIRECT,no-resolve

  # 6) 代理集合（国外/GFW）
  - RULE-SET,proxy,🚀 默认代理
  - RULE-SET,gfw,🚀 默认代理

  # 7) 兜底
  - MATCH,🐟 漏网之鱼
